
[project]
name = "clincnv2vcf"
version = "v1.0.0-beta3"
description = "Convert ClinCNV TSV file(s) to VCF format."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyfaidx>=0.9.0.3",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["E501"]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]
