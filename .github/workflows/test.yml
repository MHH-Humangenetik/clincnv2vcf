name: Run pytest unit tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Setup dependencies
        run: |
          uv sync --group dev
      - name: Lint with ruff
        # default set of ruff rules with GitHub Annotations
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Test with pytest
        run: |
          uv run pytest --cov=clincnv2vcf --junitxml=junit/test-results.xml --cov-report=xml --cov-report=html
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-xml
          path: junit/test-results.xml
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
      - name: Upload pytest coverage results xml
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-xml
          path: coverage.xml
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
      - name: Upload pytest coverage results html
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-html
          path: htmlcov
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
